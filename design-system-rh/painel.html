              empty: 'Nenhuma admissão com esse termo. Limpe o filtro para ver todas.',
              columns: [
                { key: 'name', label: 'Pessoa', render: function (r) { return h('div', { className: 'irh-cell-person' }, h(R.Avatar, { name: r.name, size: 'sm' }), h('div', null, h('b', null, r.name), h('small', null, r.role))); } },
                { key: 'dept', label: 'Departamento' },
                { key: 'start', label: 'Início', mono: true },
                { key: 'stage', label: 'Etapa', render: function (r) { return h(R.StatusBadge, { tone: r.stage[1], size: 'sm' }, r.stage[0]); } }
              ],
              rows: rows
            }))),

        rejecting ? h('div', { className: 'scrim', onClick: function (e) { if (e.target === e.currentTarget) setRejecting(null); } },
          h('form', { className: 'dialog', role: 'dialog', 'aria-modal': true, 'aria-labelledby': 'rej-t', noValidate: true, onSubmit: confirmReject },
            h('h2', { id: 'rej-t' }, 'Recusar ' + rejecting.kind.toLowerCase() + ' de ' + rejecting.name + '?'),
            h('p', null, first(rejecting.name) + ' vai receber o motivo por e-mail e no portal do colaborador.'),
            h(R.TextField, { id: 'motivo', label: 'Motivo da recusa', required: true, autoFocus: true, value: reason,
              placeholder: 'Ex.: período coincide com o fechamento do trimestre',
              error: reasonErr ? 'Escreva o motivo com pelo menos 5 caracteres.' : undefined,
              onChange: function (e) { setReason(e.target.value); if (reasonErr) setReasonErr(false); } }),
            h('footer', null,
              h(R.Button, { variant: 'secondary', onClick: function () { setRejecting(null); } }, 'Cancelar'),
              h(R.Button, { variant: 'danger', type: 'submit' }, 'Recusar solicitação')))) : null,

        toast ? h('div', { className: 'toast', role: 'status' }, h(R.Icon, { name: 'check-circle' }), h('span', null, toast)) : null));
  }

  ReactDOM.createRoot(document.getElementById('app')).render(h(App));
})();
</script>
</body>
</html>
